default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DB_USERNAME", "autogallery") %>
  password: <%= ENV.fetch("DB_PASSWORD", "autogallery123") %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "carrosdb") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "carrosdb_test") %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "carrosdb") %>
    username: <%= ENV.fetch("DB_USERNAME", "autogallery") %>
    password: <%= ENV.fetch("DB_PASSWORD", "autogallery123") %>
  cache:
    <<: *primary_production
    database: carrosdb_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: carrosdb_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: carrosdb_production_cable
    migrations_paths: db/cable_migrate
